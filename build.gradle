plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.0-dev'
group = 'cn.academy'
base { archivesName = 'academycraft' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.252'
    runs {
        client { client(); gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('clientDirectory').getOrElse('run-client')); if(providers.gradleProperty('visualQA').getOrElse('false').toBoolean())systemProperty 'academy.visual.qa','true'; if(providers.gradleProperty('wirelessQA').getOrElse('false').toBoolean())systemProperty 'academy.wireless.qa','true' }
        server { server(); gameDirectory = layout.projectDirectory.dir('run-server'); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            // Independent run directories prevent test fixtures from touching client/server saves.
            gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('gameTestDirectory').getOrElse('run-gametest'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'academy'
        }
        restartGameTest {
            type = 'gameTestServer'
            gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('restartDirectory').getOrElse('run-restart'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'academy_restart'
            systemProperty 'academy.restart.phase', providers.gradleProperty('restartPhase').getOrElse('verify')
            programArgument '--world'
            programArgument 'academy-restart-world'
        }
    }
    mods { academy { sourceSet(sourceSets.main) } }
}
repositories { mavenCentral() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
