['classicInterfererSourceTest':'cn.academy.port.interferer.ClassicInterfererSourceOracleTest',
 'classicInterfererDataTest':'cn.academy.port.interferer.ClassicInterfererDataRegressionTest',
 'classicInterfererVisualTest':'cn.academy.port.client.ClassicInterfererVisualRegressionTest'].each { taskName,className ->
