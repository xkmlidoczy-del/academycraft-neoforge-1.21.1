// The original developer/category lifecycle compiles only in isolated hashed test resources.
tasks.register('classicDeveloperLifecycleSourceTest',JavaExec) {
 dependsOn testClasses
 classpath=sourceSets.test.runtimeClasspath
 mainClass='cn.academy.port.core.ClassicDeveloperLifecycleSourceOracleTest'
 enableAssertions=true
}
tasks.named('check') { dependsOn 'classicDeveloperLifecycleSourceTest' }

// Fresh CPData constructor/wake/cache semantics through the actual modern storage codec.
tasks.register('classicFreshCpStorageTest',JavaExec) {
 dependsOn testClasses
 classpath=sourceSets.test.runtimeClasspath
 mainClass='cn.academy.port.core.ClassicFreshCpStorageRegressionTest'
 enableAssertions=true
}
tasks.named('check') { dependsOn 'classicFreshCpStorageTest' }

// Generic AbilityData learning/XP and CPData priority boundaries against unchanged originals.
['classicProgressEventsSourceTest':'cn.academy.port.core.ClassicProgressEventsSourceOracleTest',
 'classicProgressEventsBusTest':'cn.academy.port.api.ClassicProgressEventsBusTest',
 'classicProgressEventsServerLinkTest':'cn.academy.port.maintenance.ClassicProgressEventsServerLinkTest'].each {taskName,className ->
 tasks.register(taskName,JavaExec) {dependsOn testClasses;classpath=sourceSets.test.runtimeClasspath;mainClass=className;enableAssertions=true}
 tasks.named('check') {dependsOn taskName}
}

